[package]
name = "armador-pdf"
version = "0.6.0"
license = "MIT"
description = "Junta varios documentos en un solo PDF"
authors = ["Horno de Barro"]
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = "0.37.0"
hayro = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lopdf = "0.47.0"
rfd = "0.18.0"

[build-dependencies]
embed-resource = "3.0.12"
